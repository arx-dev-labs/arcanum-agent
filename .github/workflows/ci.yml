name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  NODE_VERSION: '20'

jobs:
  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # Single root lockfile covers the whole npm workspace
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Unit tests
        working-directory: ./frontend
        run: npm test

  # Engine Tests (Linux)
  engine-test-linux:
    name: Engine Tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./engine
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

  # Engine Tests (macOS)
  engine-test-macos:
    name: Engine Tests (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./engine
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake openssl@3

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build
        run: |
          cd build
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

  # Engine Tests (Windows)
  engine-test-windows:
    name: Engine Tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./engine
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install cmake openssl --confirm
          Add-Content $env:GITHUB_PATH "C:\Program Files\CMake\bin"

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: |
          cd build
          cmake --build . --config Release -j

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release

  # Build Release Binaries (one job per OS so each archive pairs the
  # frontend with an engine binary built on the same platform)
  build-release:
    name: Build Release (${{ matrix.os }})
    needs: [frontend-test, engine-test-linux, engine-test-macos, engine-test-windows]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            engine_bin: arx-engine
            frontend_bin: arx
          - os: macos-latest
            name: macos-x64
            engine_bin: arx-engine
            frontend_bin: arx
          - os: windows-latest
            name: win-x64
            engine_bin: arx-engine.exe
            frontend_bin: arx.exe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev
          cd engine
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)

      - name: Build engine (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3
          cd engine
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Build engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --confirm
          Add-Content $env:GITHUB_PATH "C:\Program Files\CMake\bin"
          cd engine
          New-Item -ItemType Directory -Force -Path build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release -j

      - name: Package binaries
        working-directory: ./frontend
        run: |
          npx pkg dist/cli.js --target node20-${{ matrix.name }} --output dist/${{ matrix.frontend_bin }}
          Copy-Item ../engine/build/${{ matrix.engine_bin }} dist/

      - name: Create release archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd frontend/dist
          tar -czf $GITHUB_WORKSPACE/arx-${{ matrix.name }}.tar.gz arx arx-engine

      - name: Create release archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd frontend/dist
          tar -czf $GITHUB_WORKSPACE/arx-${{ matrix.name }}.tar.gz arx arx-engine

      - name: Create release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd frontend/dist
          Compress-Archive -Path arx.exe, arx-engine.exe -DestinationPath $env:GITHUB_WORKSPACE/arx-${{ matrix.name }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: arx-${{ matrix.name }}.*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: |
            arx-${{ matrix.name }}.tar.gz
            arx-${{ matrix.name }}.zip

  # Docker Build
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t arcanum-agent:${{ github.sha }} .
          docker tag arcanum-agent:${{ github.sha }} arcanum-agent:latest

      - name: Push to registry
        if: github.event_name == 'release'
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push arcanum-agent:${{ github.sha }}
          docker push arcanum-agent:latest
